---
- hosts: all
  become: true
  tasks:

    # Ensure the remote_tmp directory exists with correct permissions (to avoid warnings)
    - name: Ensure remote_tmp directory exists with correct permissions
      file:
        path: "/home/{{ web_user }}/.ansible/tmp"
        state: directory
        mode: '0755'
        owner: "{{ web_user }}"
        group: "{{ web_user }}"

    # Ensure the directory exists and is owned by 'web_user'
    - name: Make sure the remote app root exists and has the right permissions
      file:
        path: "{{ remote_www_root }}/{{ app_root_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ web_user }}"  # Ensure owner is web_user
        group: "{{ web_user }}"  # Ensure group is web_user

    # Rsync application files to the remote server
    - name: Rsync application files to the remote server
      synchronize:
        src: "application/{{ app_root_dir }}"
        dest: "{{ remote_www_root }}"
        rsync_opts:
          - "--no-motd"
          - "--exclude=.git,vendor,tests,storage/logs/*,storage/framework/sessions/*,storage/framework/cache/*"
          - "--chown={{ web_user }}:{{ web_user }}"  # Set ownership to web_user:web_user

    # Set ACL permissions for www-data user on storage
    - name: Set up additional directory permissions for www-data user on storage folder
      acl:
        path: "{{ remote_www_root }}/{{ app_root_dir }}/storage/"
        entry: group:www-data:rwX
        recursive: yes
        state: present

    # Set ACL permissions for www-data user on bootstrap/cache
    - name: Set up additional directory permissions for www-data user on bootstrap/cache folder
      acl:
        path: "{{ remote_www_root }}/{{ app_root_dir }}/bootstrap/cache/"
        entry: group:www-data:rwX
        recursive: yes
        state: present

    # Set up .env file
    - name: Set up .env file
      template:
        src: laravel-env.j2
        dest: "{{ remote_www_root }}/{{ app_root_dir }}/.env"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"

    # Install Composer dependencies (should run before npm tasks)
    - name: Install Dependencies with Composer
      become: true  # Use sudo to ensure proper permissions
      become_user: "{{ web_user }}"  # Run as web_user
      composer:
        command: install
        working_dir: "{{ remote_www_root }}/{{ app_root_dir }}"
      tags: [ 'composer:install' ]

    # Clear npm cache to avoid potential installation issues
    - name: Clear npm cache
      command: "npm cache clean --force"
      become: true
      become_user: "{{ web_user }}"
      args:
        chdir: "{{ remote_www_root }}/{{ app_root_dir }}"
      tags: npm

    # Install npm dependencies (runs after Composer dependencies are installed)
    - name: Install npm dependencies
      become: true
      become_user: "{{ web_user }}"
      npm:
        path: "{{ remote_www_root }}/{{ app_root_dir }}"
        production: false  # Set to true if you only want production dependencies
      tags: [ 'npm:install' ]

    # Run npm build
    - name: Build the project (npm run build)
      become: true
      become_user: "{{ web_user }}"
      command: "npm run build"
      args:
        chdir: "{{ remote_www_root }}/{{ app_root_dir }}"
      tags: [ 'npm:build' ]

    # Generate Laravel application key
    - name: Generate app key
      become: true
      become_user: "{{ web_user }}"  # Run as web_user
      command: "/usr/bin/php {{ remote_www_root }}/{{ app_root_dir }}/artisan key:generate"
      tags: [ 'laravel', 'artisan:key' ]

    # Check if storage link exists
    - name: Check if storage link exists
      stat:
        path: "{{ remote_www_root }}/{{ app_root_dir }}/public/storage"
      register: storage_link

    # Create storage symlink if not exists
    - name: Set up app storage link
      become: true
      become_user: "{{ web_user }}"
      command: "/usr/bin/php {{ remote_www_root }}/{{ app_root_dir }}/artisan storage:link"
      when: not storage_link.stat.exists
      tags: [ 'laravel', 'artisan:storage' ]

    # Install Faker package directly (Composer will not reinstall if already installed)
    - name: Install Faker package
      become: true
      become_user: "{{ web_user }}"
      composer:
        command: require
        arguments: fakerphp/faker --dev
        working_dir: "{{ remote_www_root }}/{{ app_root_dir }}"
      tags: [ 'composer:install', 'faker' ]

    # Run migrations and seeders
    - name: Run Migrations + Seeders
      become: true
      become_user: "{{ web_user }}"  # Run as web_user
      command: "/usr/bin/php {{ remote_www_root }}/{{ app_root_dir }}/artisan migrate --seed"
      tags: [ 'laravel', 'artisan:migrate' ]
